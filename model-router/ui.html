<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spark Model Router</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1c1c1a; --muted:#6b6b66; --card:#fff; --line:#dddcd6; --accent:#3d6b4f; --warn:#9a6a12; --bad:#a33; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --fg:#ecebe6; --muted:#9a9993; --card:#1f1f1d; --line:#33332f; --accent:#7fb592; --warn:#d9a441; --bad:#e57373; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; padding:24px 16px; }
  main { max-width:860px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  select, textarea, button { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  select { flex:1; min-width:220px; }
  textarea { width:100%; min-height:110px; resize:vertical; margin:10px 0; }
  button { background:var(--accent); color:#fff; border:none; padding:9px 18px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:400; }
  label { font-size:13px; color:var(--muted); display:flex; gap:6px; align-items:center; }
  #status { font-size:13px; color:var(--muted); }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); margin-left:6px; }
  .ready { color:var(--accent); border-color:var(--accent); }
  .busy { color:var(--warn); border-color:var(--warn); }
  .err { color:var(--bad); border-color:var(--bad); }
  #out { white-space:pre-wrap; word-wrap:break-word; min-height:60px; }
  #think { white-space:pre-wrap; color:var(--muted); font-size:13px; border-left:3px solid var(--line); padding-left:10px; margin-bottom:10px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-top:12px; }
  .stat { border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  .stat b { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  .stat span { font-size:12px; color:var(--muted); }
  code { font-size:12px; }
  .mrow { display:flex; gap:10px; align-items:center; justify-content:space-between; padding:8px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
  .mrow:first-of-type { border-top:none; }
  .mname { font-weight:600; word-break:break-all; }
  .mjob { font-size:12px; color:var(--muted); width:100%; }
  .mjob pre { white-space:pre-wrap; word-wrap:break-word; margin:6px 0 0; max-height:180px; overflow:auto; font-size:11px; }
</style>
</head>
<body>
<main>
  <h1>Spark Model Router</h1>
  <p class="sub">API for your apps: <code id="api"></code> · pick <b>any</b> to use whatever model is loaded (no switch)</p>

  <div class="card">
    <div class="row">
      <select id="model"></select>
      <label><input type="checkbox" id="thinking"> thinking</label>
      <label>max tokens <input type="number" id="max" value="1024" min="1" style="width:80px"></label>
    </div>
    <textarea id="prompt">Explain in three sentences what a DGX Spark is good for.</textarea>
    <div class="row">
      <button id="send">Send</button>
      <button id="stop" class="ghost" disabled>Stop</button>
      <span id="status"></span>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between"><b>Models</b><button id="recheck" class="ghost">Re-check</button></div>
    <div id="models"></div>
  </div>

  <div class="card">
    <div id="think" hidden></div>
    <div id="out"></div>
    <div class="stats">
      <div class="stat"><b id="s-model">–</b><span>answered by</span></div>
      <div class="stat"><b id="s-ttft">–</b><span>time to first token</span></div>
      <div class="stat"><b id="s-tps">–</b><span>generation tok/s</span></div>
      <div class="stat"><b id="s-tok">–</b><span>prompt / output tokens</span></div>
      <div class="stat"><b id="s-total">–</b><span>total time</span></div>
    </div>
  </div>
</main>
<script>
const $ = id => document.getElementById(id);
$("api").textContent = location.origin + "/v1";
let ctrl = null;

async function loadModels() {
  const r = await fetch("/v1/models"); const j = await r.json();
  const sel = $("model"), keep = sel.value;
  sel.innerHTML = "";
  for (const m of j.data) {
    const o = document.createElement("option");
    o.value = m.id; o.textContent = m.id + (m.id !== "any" && m.loaded ? "  (loaded)" : "")
      + (m.installed === false ? "  (not installed)" : "");
    sel.appendChild(o);
  }
  sel.value = keep || "any";
}

async function pollStatus() {
  try {
    const s = await (await fetch("/router/status")).json();
    const cls = s.state === "ready" ? "ready" : s.state === "error" ? "err" : "busy";
    let t = `router: <span class="pill ${cls}">${s.state}</span>`;
    if (s.loaded) t += ` loaded <b>${s.loaded}</b>`;
    if (s.switching_to) t += ` → switching to <b>${s.switching_to}</b>`;
    if (s.in_flight) t += ` · ${s.in_flight} running`;
    if (s.waiting) t += ` · ${s.waiting} waiting`;
    if (s.last_error && s.state === "error") t += ` · <span class="pill err">${s.last_error.slice(0,120)}</span>`;
    $("status").innerHTML = t;
  } catch { $("status").textContent = "router unreachable"; }
}

$("send").onclick = async () => {
  $("out").textContent = ""; $("think").textContent = ""; $("think").hidden = true;
  for (const k of ["s-model","s-ttft","s-tps","s-tok","s-total"]) $(k).textContent = "…";
  $("send").disabled = true; $("stop").disabled = false;
  ctrl = new AbortController();
  const t0 = performance.now(); let tFirst = null, tLast = null, usage = null, waiting = false;
  // A dropped connection before any answer (e.g. the browser resetting streams on a
  // network change while a model loads) is retried; the router just keeps waiting.
  for (let attempt = 1; attempt <= 4; attempt++) {
  try {
    const r = await fetch("/v1/chat/completions", {
      method: "POST", signal: ctrl.signal, headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: $("model").value, stream: true, stream_options: {include_usage: true},
        max_tokens: +$("max").value,
        chat_template_kwargs: {enable_thinking: $("thinking").checked},
        messages: [{role: "user", content: $("prompt").value}]
      })
    });
    $("s-model").textContent = r.headers.get("X-Router-Model") || "–";
    if (!r.ok) { $("out").textContent = "Error " + r.status + ": " + await r.text(); break; }
    const rd = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const {done, value} = await rd.read(); if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split("\n"); buf = lines.pop();
      for (const line of lines) {
        if (line.startsWith(":")) {   // router keep-alive while a model loads
          const secs = Math.round((performance.now() - t0) / 1000);
          $("out").textContent = "⏳ " + line.slice(1).trim() + " — " + secs + " s";
          waiting = true; continue;
        }
        if (!line.startsWith("data:") || line.includes("[DONE]")) continue;
        if (waiting) { $("out").textContent = ""; waiting = false; }
        const d = JSON.parse(line.slice(5));
        if (d.error) { $("out").textContent = "Error: " + (d.error.message || JSON.stringify(d.error)); continue; }
        if (d.usage) usage = d.usage;
        const delta = d.choices?.[0]?.delta || {};
        const th = delta.reasoning_content || delta.reasoning;
        if (th || delta.content) { tLast = performance.now(); if (tFirst === null) tFirst = tLast; }
        if (th) { $("think").hidden = false; $("think").textContent += th; }
        if (delta.content) $("out").textContent += delta.content;
      }
    }
    break;
  } catch (e) {
    if (e.name === "AbortError") break;
    if (tFirst === null && attempt < 4) {
      $("out").textContent = "⏳ connection dropped while the model was loading — reconnecting (" + attempt + ")…";
      await new Promise(res => setTimeout(res, 1000));
      continue;
    }
    $("out").textContent += "\n[error] " + e;
    break;
  }
  }
  {
    const total = (performance.now() - t0) / 1000;
    $("s-total").textContent = total.toFixed(1) + " s";
    $("s-ttft").textContent = tFirst ? ((tFirst - t0) / 1000).toFixed(2) + " s" : "–";
    if (usage) {
      $("s-tok").textContent = usage.prompt_tokens + " / " + usage.completion_tokens;
      if (tFirst && tLast > tFirst && usage.completion_tokens > 1)
        $("s-tps").textContent = ((usage.completion_tokens - 1) / ((tLast - tFirst) / 1000)).toFixed(1);
      else $("s-tps").textContent = "–";
    } else { $("s-tok").textContent = "–"; $("s-tps").textContent = "–"; }
    $("send").disabled = false; $("stop").disabled = true;
    loadModels(); pollStatus();
  }
};
$("stop").onclick = () => ctrl && ctrl.abort();
$("prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("send").click(); });

const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function loadInstalls(refresh) {
  try {
    const j = await (await fetch("/router/installs" + (refresh ? "?refresh=1" : ""))).json();
    let h = "", running = false;
    for (const [name, m] of Object.entries(j.models)) {
      const job = m.job, active = job && (job.state === "running" || job.state === "queued");
      running = running || active;
      const pill = m.installed ? '<span class="pill ready">installed</span>'
        : m.installed === false ? `<span class="pill busy">not installed: ${esc((m.missing || []).join(", "))}</span>`
        : '<span class="pill">checking</span>';
      h += `<div class="mrow"><span><span class="mname">${esc(name)}</span>${pill}</span>`;
      if (m.installed === false) h += `<button data-install="${esc(name)}" ${active ? "disabled" : ""}>${active ? "Installing…" : "Install"}</button>`;
      if (job) {
        const res = Object.entries(job.results || {}).map(([k, v]) => esc(k) + ": " + esc(v)).join(" · ");
        h += `<div class="mjob">install <span class="pill ${job.state === "done" ? "ready" : job.state === "failed" ? "err" : "busy"}">${esc(job.state)}</span>`
           + (job.step ? ` ${esc(job.step)}` : "") + (res ? ` · ${res}` : "") + (job.error ? ` · ${esc(job.error)}` : "")
           + (job.log_tail ? `<pre>${esc(job.log_tail)}</pre>` : "") + "</div>";
      }
      h += "</div>";
    }
    $("models").innerHTML = h;
    for (const b of document.querySelectorAll("[data-install]")) b.onclick = async () => {
      b.disabled = true; b.textContent = "Installing…";
      const r = await fetch("/router/install", {method: "POST", headers: {"Content-Type": "application/json"},
                                                body: JSON.stringify({model: b.dataset.install})});
      if (!r.ok) alert((await r.json()).error?.message || r.status);
      loadInstalls();
    };
    clearTimeout(loadInstalls.t);
    loadInstalls.t = setTimeout(loadInstalls, running ? 3000 : 30000);
  } catch { $("models").textContent = "router unreachable"; }
}
$("recheck").onclick = () => loadInstalls(true);

loadModels(); pollStatus(); setInterval(pollStatus, 3000); loadInstalls();
</script>
</body>
</html>
